  "Applied AI engineer with 6 years building production agents, RAG platforms, and shared GenAI infrastructure. Now at Cookpad developing multimodal coaching agents, with a focus on agent evaluation, reasoning architecture, and reliability. Previously led an MLE team delivering production GenAI systems in financial services.": "本番環境のエージェント、RAG基盤、共有GenAIインフラの構築に6年従事してきたApplied AIエンジニア。現在はCookpadにて、エージェント評価・推論アーキテクチャ・信頼性を軸にマルチモーダルなコーチングエージェントを開発。以前は金融サービス領域で、本番GenAIシステムを届けるMLEチームをリード。"

