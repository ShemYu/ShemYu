headline: Senior AI Engineer | AI Agents, Multimodal AI, RAG & MLOps
summary: >-
  Senior AI engineer with 6+ years building and productionizing AI agents,
  multimodal systems, enterprise RAG, and shared GenAI platforms across consumer
  and financial products. Combines hands-on architecture and production
  engineering with people leadership, evaluation discipline, and measurable
  improvements in quality, latency, cost, and delivery speed.
