id: one-pager
locale: en
editorial_standard: senior-impact-v1
person: shem
headline: Senior AI Engineer | AI Agents, Multimodal Systems & GenAI Platforms
summary: >-
  Senior AI engineer with 6+ years in applied AI. Production agents, RAG, MLOps,
  and shared GenAI infrastructure — serving, APIs, deploy — concentrated in the
  last four years, across financial services and consumer products. Hands-on on
  architecture and production; previously led an MLE team. Usual levers:
  evaluation, latency, cost, and delivery speed.
summary_ja: >-
  Applied AIに6年以上従事。本番エージェント、RAG、MLOps、共有GenAIインフラ（serving、API、デプロイ）は直近4年が中心。金融とコンシューマ製品。アーキテクチャと本番を自ら担当し、以前はMLEチームをリード。評価、レイテンシ、コスト、デリバリー速度を主なレバーとする。
contact:
  email: true
  phone: false
  location: true
  profiles:
    - LinkedIn
    - GitHub
roles:
  - id: cookpad-senior-ai
    include_summary: false
    claims:
      - id: cookpad-vu-pipeline
        supporting_claims:
          - cookpad-vu-dish-coverage
        text: >-
          Built and iterated a staged video-understanding pipeline spanning observation,
          ingredient-state reasoning, and cooking-issue detection; improved dish coverage
          on a fixed evaluation set from 50% to 95%.
        text_ja: 観察、材料状態の推論、調理上の課題検出を段階化した動画理解パイプラインを構築・反復し、固定評価セットで料理カバレッジを50%から95%へ向上。
      - id: cookpad-vu-evals
        text: >-
          Established capability-based evaluations and automated scoring for observation
          accuracy, issue coverage, factuality, coherence, and turn-level coaching quality.
  - id: cathay-mle-lead
    title: Machine Learning Engineer / Team Lead
    summary: >-
      Led 4 full-time engineers (7 including contractors) across production AI deployment
      and internal agent development.
    include_summary: true
    claims:
      - id: cathay-gaia-infra
        text: >-
          Designed and built enterprise GenAI infrastructure spanning an AI Gateway,
          guardrails, and MLflow, reducing latency for internal AI services by 60%.
      - id: cathay-dogi-agents
        text: >-
          Designed and delivered internal research automation that reduced a two-hour
          analysis workflow to 15 minutes.
        text_ja: >-
          社内リサーチ自動化を設計・提供し、2時間の分析業務を15分へ短縮。
      - id: cathay-rkb-discovery
        supporting_claims:
          - cathay-rkb-f1
          - cathay-rkb-adoption
        text: >-
          Mapped a regulatory-comparison workflow with legal and compliance stakeholders,
          then productionized the PoC on Databricks; improved the agent's F1 from 0.67 to
          0.89. Adopted by 2 of 5 subsidiaries.
        text_ja: 法務・コンプライアンス関係者と規制比較ワークフローを整理し、PoCをDatabricks上で本番運用に向けてワークフロー化。エージェントのF1を0.67から0.89へ改善。5社中2社で採用。
  - id: wisers-platform-engineer
    include_summary: false
    claims:
      - id: wisers-templates
        text: >-
          Standardized ML delivery with FastAPI, CI/CD, and Kubernetes templates, cutting
          deployment time from 2 weeks to 3 days; adopted by 30+ projects.
      - id: wisers-uap
        text: >-
          Built a shared NLP Python library with 70% internal adoption and 90%+ code
          coverage, improving developer productivity and reliability.
  - id: tripsaas-data-scientist
    include_summary: false
    claims:
      - id: tripsaas-clustering
        text: >-
          Analyzed customer-order data with FP-Growth and K-means clustering to support
          marketing segmentation.
