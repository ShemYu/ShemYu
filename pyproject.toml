[project]
name = "shemyu"
version = "0.1.0"
description = "Generate a GitHub profile and resumes from structured career data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
tailoring = [
    "openai-agents>=0.19.4",
    "python-dotenv>=1.2.2",
]
pdf = [
    "weasyprint>=63.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
