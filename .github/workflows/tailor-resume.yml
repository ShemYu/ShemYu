name: Tailor Resume with OpenAI

on:
  workflow_dispatch:
    inputs:
      job_description:
        description: Full job description
        required: true
        type: string
      output_name:
        description: Safe output basename (letters, numbers, underscores, hyphens)
        required: true
        default: resume_tailored
        type: string

permissions:
  contents: read

jobs:
  tailor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if OPENAI_API_KEY is empty
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "Repository secret OPENAI_API_KEY is empty."
            echo "Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked tailoring dependencies
        run: uv sync --locked --extra tailoring

      - name: Run tests
        run: uv run --locked --extra tailoring python -m unittest discover -s tests -v

      - name: Store job description safely
        env:
          JOB_DESCRIPTION: ${{ inputs.job_description }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path

          text = os.environ["JOB_DESCRIPTION"].strip()
          if not text:
              raise SystemExit("The job description must not be empty.")
          Path("/tmp/job-description.txt").write_text(text, encoding="utf-8")
          PY

      - name: Generate tailored resume
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          uv run --locked --extra tailoring python -m src.main /tmp/job-description.txt --output-name "$OUTPUT_NAME"

      - name: Prepare tailored artifact
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          mkdir -p /tmp/tailored-resume
          cp "output/tailored/$OUTPUT_NAME.md" /tmp/tailored-resume/
          cp "output/tailored/$OUTPUT_NAME.html" /tmp/tailored-resume/
          cp "output/tailored/${OUTPUT_NAME}_bible.html" /tmp/tailored-resume/

      - name: Upload tailored resume
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailored-resume-${{ inputs.output_name }}
          path: /tmp/tailored-resume
          if-no-files-found: error
          retention-days: 7
