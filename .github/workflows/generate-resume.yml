name: Validate and Generate Resume

on:
  pull_request:
    paths:
      - "data/**"
      - "src/**"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "src/**"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run core tests without AI extras
        run: >-
          uv run --locked python -m unittest -v
          tests.test_generator tests.test_loader tests.test_main tests.test_schema
          tests.test_tailor_eval

      - name: Verify package build
        run: uv build

      - name: Smoke-test built wheel
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python - <<'PY'
          import os
          from pathlib import Path

          import src.main

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          imported = Path(src.main.__file__).resolve()
          if imported.is_relative_to(checkout):
              raise SystemExit(f"Imported checkout source instead of wheel: {imported}")
          print(f"Imported wheel module: {imported}")
          PY

      - name: Generate canonical artifacts
        run: uv run --locked python -m src.main

      - name: Upload generated artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-resume
          path: |
            README.md
            RESUME.md
            output/resume.html
            output/resume_bible.html
          if-no-files-found: error
          retention-days: 1

  tailoring-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true

      - name: Sync tailoring dependencies
        run: uv sync --locked --extra tailoring

      - name: Run tailoring tests
        run: uv run --locked --extra tailoring python -m unittest tests.test_ai -v

  commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - tailoring-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-resume
          path: .

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- README.md RESUME.md output/resume.html output/resume_bible.html)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md RESUME.md output/resume.html output/resume_bible.html
          git commit -m "chore: regenerate resume [skip ci]"
          git push
