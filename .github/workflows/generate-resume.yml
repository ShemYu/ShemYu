name: Generate Resume

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'data/**'
      - 'generate_resume.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install pyyaml jinja2 google-generativeai python-dotenv

      - name: Generate Resume
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code RESUME.md resume.html README.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add RESUME.md resume.html README.md
          git commit -m "chore: auto-generate resume and profile [skip ci]"
          git push
