name: Generate Resume

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Generate Resume
        run: uv run python -m src.main

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain -- README.md RESUME.md output/resume.html output/resume_bible.html)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md RESUME.md output/resume.html output/resume_bible.html
          git commit -m "chore: auto-generate resume and profile [skip ci]"
          git push
