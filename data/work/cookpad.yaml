name: Cookpad
position: Senior AI Engineer
startDate: "2026-02"
endDate: "Present"
location: Tokyo, Japan
summary: Building AI that makes everyday life more joyful.
highlights:
  - "Built a video question-understanding agent that reads cooking video and learner voice to decide reteach, narrow, or advance; raised chef-grounded candidate coverage from 40% to 95%."
  - "Designed versioned, capability-based agent evaluations and automated scoring for coverage, truth, coherence, and per-turn quality."
  - "From cooking video and learner voice, infer where the learner is stuck so the next reteach targets that gap instead of a generic next step."
evidence:
  - "Internal coaching eval used a 15-case, 103-unit benchmark; a 56-case full run completed in under 9 minutes with cache/resume and case-level backtraces."
  - "RCA across 73 flaky misses: 64% originated as incomplete candidate hypotheses; Knowledge coverage swing +/-8.5 pp to +/-3.2 pp (62% reduction)."
  - "Public coverage result corrected by Shem: 40% to 95%. Do not use 67.6% to 83.0% on outbound resumes."
