name: Cookpad
position: Senior AI Engineer
startDate: "2026-02"
endDate: "Present"
location: Tokyo, Japan
summary: Building AI that makes everyday life more joyful.
highlights:
  - "Built and iterated the video-understanding system as a staged pipeline: observable facts → recipe-specific ingredient definitions → ingredient state → cooking issues."
  - "Raised dish coverage from 50% to 95% (53/56) on a fixed 15-case, 56-item eval set; knowledge coverage remains the remaining optimization target."
  - "Capability-based evals and automated scoring for observation accuracy, issue coverage, factuality, coherence, and turn-level coaching quality."
evidence:
  - "[A. Product] Video-understanding and cooking-coaching agent that uses cooking video and learner voice to identify where the learner is stuck. The public architecture is observable facts → recipe-specific ingredient definitions → ingredient state → cooking issues."
  - "[B. Fixed-rubric result] Dish coverage improved from 28/56 to 53/56 (50% → 94.6%, published as 95%) across the same 15 cases between 2026-07-08 and 2026-07-27. Source: daily/history.json."
  - "[B. Metric boundary] The earlier 30/74 (40.5%) reading and the later 61-item v3_canonical_claim use different rubrics and must not be compared with the 56-item result. Knowledge coverage remained an optimization target."
  - "[B. Additional internal results] Candidate coverage improved from 67.6% to 83.0% on a separate 15-case, 103-unit benchmark. Evaluation work also included a sub-9-minute 56-case run, RCA across 73 flaky misses, and reduced Knowledge coverage swing from +/-8.5 pp to +/-3.2 pp. Keep these separate from the public 56-item dish metric."
  - "[C.1 Architecture research] Built a detailed video-description and verification pipeline for 20–50 minute videos, then proposed separating broad candidate recall from precision-focused investigation through Candidate Generator → Ranker → Investigator. This work informed later designs but was not verified as the shipped architecture."
  - "[C.3 Guideline Grounder v1] Defined the upstream observation problem and designed and implemented a staged Detect → Plan → Select → Observe → Correct pipeline so downstream causal diagnosis could be evaluated independently. A legacy 14-case manual review found dish-specific signals in 13 cases but correct diagnoses in only 2, isolating unresolved primary-cause selection in Assessment. This is stage-diagnostic evidence, not visual accuracy or uplift. Sources: PR #299 and cooking_experiment_analysis/report/20250423/."
  - "[C.4 ObservationAgent] Designed the v2 ObservationAgent and mentored Sonan through its implementation; the iteration was not verified as production. Source: PR #461 / 741fa4a3."
  - "[C.5 Video infrastructure] Built Video Explorer, video embeddings, reusable similarity-search infrastructure, semantic video retrieval, and a multi-turn frame locator. Migrated Gemini Embedding 2 to 3072 dimensions with model-scoped caching. No retrieval-quality uplift is sourced. Sources: PRs #202/#213/#217/#220/#222/#239."
  - "[C.6 Evaluation architecture] Built versioned assessment suites, frozen-state replay, LLM judging, failure taxonomies, canonical GT contracts, review surfaces, and a video-fact audit. Treat human-equivalence gates as conformance evaluation, not production accuracy."
  - "[D. Git-history inventory] `career_evidence/moment_coach_ai_git_history.md` maps 33 main-branch contributions from 2026-02-27 through 2026-08-19 to resume-relevant facts and evidence boundaries."
